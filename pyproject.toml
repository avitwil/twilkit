[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twilkit"
version = "2.0.1"
description = "Lightweight Python toolkit: validators, colors, decorators, and FlexVar"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Avi Twil" }
]
keywords = ["validation", "decorators", "colors", "ansi", "toolkit", "utilities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities"
]
requires-python = ">=3.10"




[project.urls]
Homepage = "https://github.com/avitwil/twilkit"
Repository = "https://github.com/avitwil/twilkit"
Issues = "https://github.com/avitwil/twilkit/issues"


[project.optional-dependencies]
# NOTE: twilkit.extra_tools now imports the ADVfile_manager copy bundled
# inside twilkit itself (a frozen vendored snapshot, currently v1.1.0 -
# see twilkit/ADVfile_manager/__init__.py) via a relative import, so this
# extra is no longer required for `twilkit.extra_tools` to work. It is
# kept as an opt-in way to also install the actively-maintained standalone
# ADVfile_manager package from PyPI if you want it for other purposes.
extra_tools = ["ADVfile-manager>=1.1.0"]
